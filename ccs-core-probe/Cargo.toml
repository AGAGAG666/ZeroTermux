[package]
name = "ccs-core-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"

# 与 cc-switch/src-tauri/Cargo.toml 严格同版本的"高风险"依赖：
# 这些需要编译 C / 汇编，是能否落地 Android sidecar 的成败点。
[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
rustls = "0.23"
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
flate2 = "1"
brotli = "7"
zstd = "0.13"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd", "time"] }
sha2 = "0.10"
hmac = "0.12"
axum = "0.7"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
json-five = "0.3.1"
sys-locale = "0.3"
dirs = "5.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
